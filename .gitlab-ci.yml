---
stages:
  - build-upload
  - release
  - deploy

variables:
  LIBJPEG_VERSION: "2.1.4"
  VIRTUALGL_VERSION: "3.0.2"
  DESTINATION: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME"
  ANATOSCOPE_PUBLIC_PACKAGES: "$CI_API_V4_URL/projects/35257008/packages/generic" # https://gitlab.com/anatoscope/public/public-packages
  WEBAPP_CICD_PIPELINE_REF: "master"
  BUILD_IMAGE: "ubuntu:20.04"

# Resulting file example: turbovnc_2.2.6-anatoscope-1.0.0_amd64.deb
# Format: turbovnc_<turbovnc_version>-anatoscope-<turbovnc_anatoscope_version>_amd64.deb
# Version showed in package registry: turbovnc_anatoscope_version
build-upload:
  stage: build-upload
  image: $BUILD_IMAGE
  rules:
    - if: '$CI_COMMIT_TAG'
  cache:
    paths:
      - libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb
      - .ccache
  script:
    - |
      EXPECTED_FULL_VERSION="$(sed -nre 's/^set\(VERSION ([0-9]+\.[0-9]+\.[0-9]+-anatoscope-[0-9]+\.[0-9]+\.[0-9]+.*)\)$/\1/p' CMakeLists.txt)"
      if [ "$CI_COMMIT_TAG" != "$EXPECTED_FULL_VERSION" ]; then
          echo "[ERROR] Tag '$CI_COMMIT_TAG' doesn't correspond to the TurboVNC-Anatoscope version '$EXPECTED_FULL_VERSION' in CMakeLists.txt" >&2
          exit 1
      fi
      # Build deps.
      DEBIAN_FRONTEND=noninteractive apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends default-jdk libpam-dev ccache cmake make gcc g++ libx11-dev python3 libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev curl wget pkg-config libxfont-dev libpixman-1-dev libglx-dev libgl-dev libdrm-dev libssl-dev libxkbfile-dev libgbm-dev mesa-common-dev libxshmfence-dev
      [ -r "libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb" ] || wget --header "JOB-TOKEN: $CI_JOB_TOKEN" "$ANATOSCOPE_PUBLIC_PACKAGES/libjpeg/${LIBJPEG_VERSION}/libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb"
      dpkg -i libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb
      # Build deb package.
      src_dir=$PWD
      export CCACHE_DIR="$src_dir"/.ccache
      mkdir -p "$CCACHE_DIR"
      ccache -M 100M
      build_dir=$(mktemp -d)
      export CCACHE_BASEDIR="$build_dir"
      export CCACHE_NOHASHDIR=1 # Expecting no sources in the build dir.
      cd "$build_dir"
      cmake -DCMAKE_C{,XX}_COMPILER_LAUNCHER=ccache -DTVNC_BUILDVIEWER=OFF -DCMAKE_BUILD_TYPE=AppWithDebInfo "$src_dir"
      make -j4 deb
      # Extract version number.
      PKG_FILE_NAME="$(ls turbovnc_*.deb | head -n1)"
      FULL_VERSION="$(echo "$PKG_FILE_NAME" | sed -nre "s/turbovnc_(.*)_[^_]+\\.deb/\\1/p")"
      TURBOVNC_ANATOSCOPE_VERSION="$(echo "$PKG_FILE_NAME" | sed -nre "s/turbovnc_.*anatoscope-([^_]+)_[^_]+\\.deb/\\1/p")"
      [ -n "$FULL_VERSION" -a -n "$TURBOVNC_ANATOSCOPE_VERSION" ]
      # Repackage with the tar.xz compression.
      repack_tmpdir="$(mktemp -d)"
      dpkg-deb -R "$PKG_FILE_NAME" "$repack_tmpdir"
      dpkg-deb -Zxz -b "$repack_tmpdir" "$PKG_FILE_NAME"
      # Create a debug archive.
      DBG_FILE_NAME=turbovnc-dbg_$EXPECTED_FULL_VERSION.tar.gz
      find . -type f -name '*.debug' -print0 | tar -czf $DBG_FILE_NAME --null -T -
      # Upload to GitLab as a generic package.
      http_response_file=$(mktemp)
      http_status="$(curl --silent --write-out "%{http_code}" --output "$http_response_file" --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$PKG_FILE_NAME" "$DESTINATION/$TURBOVNC_ANATOSCOPE_VERSION/")"
      cat $http_response_file
      echo $http_status
      [[ "$http_status" =~ 2[[:digit:]]{2} ]]
      # Upload debug info to GitLab as a generic package.
      http_response_file=$(mktemp)
      http_status="$(curl --silent --write-out "%{http_code}" --output "$http_response_file" --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$DBG_FILE_NAME" "$DESTINATION-dbg/$TURBOVNC_ANATOSCOPE_VERSION/")"
      cat $http_response_file
      echo $http_status
      [[ "$http_status" =~ 2[[:digit:]]{2} ]]
      # Save version number and packaage file name for the next stage.
      echo "FULL_VERSION=$FULL_VERSION" > "$src_dir"/build-upload.env
      echo "TURBOVNC_ANATOSCOPE_VERSION=$TURBOVNC_ANATOSCOPE_VERSION" >> "$src_dir"/build-upload.env
      echo "PKG_FILE_NAME=$PKG_FILE_NAME" >> "$src_dir"/build-upload.env
  artifacts:
    reports:
      dotenv: build-upload.env

docker-images:
  stage: release
  image: docker
  services:
    - docker:dind                   # necessary for docker run
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      [ -n "$FULL_VERSION" -a  -n "$TURBOVNC_ANATOSCOPE_VERSION" -a -n "$PKG_FILE_NAME" ]
      wget --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$DESTINATION/$TURBOVNC_ANATOSCOPE_VERSION/$PKG_FILE_NAME" \
        "$ANATOSCOPE_PUBLIC_PACKAGES/libjpeg/${LIBJPEG_VERSION}/libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb" \
        "$ANATOSCOPE_PUBLIC_PACKAGES/virtualgl/${VIRTUALGL_VERSION}/virtualgl_${VIRTUALGL_VERSION}_amd64.deb"
      versions=libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION}
      docker build --build-arg BUILDKIT_SYNTAX=docker/dockerfile:1.3.1 --build-arg="BUILD_IMAGE=$BUILD_IMAGE" --tag $CI_REGISTRY_IMAGE:${versions} .
      docker build --build-arg BUILDKIT_SYNTAX=docker/dockerfile:1.3.1 --tag $CI_REGISTRY_IMAGE:${versions}-ubuntu . -f Dockerfile-ubuntu
      docker push $CI_REGISTRY_IMAGE:${versions}
      docker push $CI_REGISTRY_IMAGE:${versions}-ubuntu
  after_script:
    # Use "--force" to prevent the command from failing if the image doesn't exist
    - versions=libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION}
    - docker rmi --force $CI_REGISTRY_IMAGE:${versions}
    - docker rmi --force $CI_REGISTRY_IMAGE:${versions}-ubuntu

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    GIT_STRATEGY: none
  script:
    - |
      [ -n "$FULL_VERSION" -a -n "$PKG_FILE_NAME" ]
      release-cli create --tag-name "$FULL_VERSION" --name "Release $FULL_VERSION" --description "Release $FULL_VERSION (Anatoscope fork version)" --assets-link "{\"name\": \"$PKG_FILE_NAME\", \"url\": \"$DESTINATION$TURBOVNC_ANATOSCOPE_VERSION/$PKG_FILE_NAME\"}"

.alpha:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  variables:
    GIT_STRATEGY: none
  image: registry.gitlab.com/anatoscope/interne/system/app/curl
  script:
    - |
      set -x
      [ -n "$FULL_VERSION" -a  -n "$TURBOVNC_ANATOSCOPE_VERSION" ]
      # Trigger a pipeline in the webapp project to copy this image to the docker
      # registry used by the webapp.
      curl --fail --request POST \
        --form "token=$CI_JOB_TOKEN" \
        --form "ref=$WEBAPP_CICD_PIPELINE_REF" \
        --form "variables[env]=alpha" \
        --form "variables[source_registry]=$CI_REGISTRY_IMAGE" \
        --form "variables[source_tag]=libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION}" \
        --form "variables[source_application]=turbovnc" \
        --form "variables[custom_tag]=libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION}" \
        "$CI_API_V4_URL/projects/$WEBAPP_CICD_PROJECT_ID/trigger/pipeline"

circle-alpha:
  extends: .alpha
  variables:
    WEBAPP_CICD_PROJECT_ID: 37235366

circle-orchestrator:
  stage: deploy
  image: docker
  services:
    - docker:dind
  variables:
    GIT_STRATEGY: none
    ORCHESTRATOR_ARTIFACT_REGISTRY: europe-docker.pkg.dev/circle-orchestrator-343847/orchestrator
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  script:
    - test -n "$FULL_VERSION" -a -n "$TURBOVNC_ANATOSCOPE_VERSION"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - base64 -d "$GOOGLE_ARTIFACT_REGISTRY_KEY_FILE" | docker login -u _json_key --password-stdin "$ORCHESTRATOR_ARTIFACT_REGISTRY"
    - tag=libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION}-ubuntu
    - docker pull $CI_REGISTRY_IMAGE:$tag
    - docker tag $CI_REGISTRY_IMAGE:$tag $ORCHESTRATOR_ARTIFACT_REGISTRY/turbovnc:$tag
    - docker rmi $CI_REGISTRY_IMAGE:$tag
    - docker push $ORCHESTRATOR_ARTIFACT_REGISTRY/turbovnc:$tag
    - docker rmi $ORCHESTRATOR_ARTIFACT_REGISTRY/turbovnc:$tag
