---
stages:
  - build-upload
  - release
  - deploy

variables:
  LIBJPEG_VERSION: "2.1.4"
  VIRTUALGL_VERSION: "3.0.2"
  DESTINATION: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/"
  WEBAPP_CICD_PIPELINE_REF: "master"
  ANATODOCKER_TAG: "6.40"

# Resulting file example: turbovnc_2.2.6-anatoscope-1.0.0_amd64.deb
# Format: turbovnc_<turbovnc_version>-anatoscope-<turbovnc_anatoscope_version>_amd64.deb
# Version showed in package registry: turbovnc_anatoscope_version
build-upload:
  stage: build-upload
  image: registry.gitlab.com/anatoscope/interne/system/anatodocker/ci:$ANATODOCKER_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
  cache:
    paths:
      - libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb
      - .ccache
  script:
    - |
      EXPECTED_FULL_VERSION="$(sed -nre 's/^set\(VERSION ([0-9]\.[0-9]\.[0-9]-anatoscope-[0-9]\.[0-9]\.[0-9].*)\)$/\1/p' CMakeLists.txt)"
      if [ "$CI_COMMIT_TAG" != "$EXPECTED_FULL_VERSION" ]; then
          echo "[ERROR] Tag '$CI_COMMIT_TAG' doesn't correspond to the TurboVNC-Anatoscope version '$EXPECTED_FULL_VERSION' in CMakeLists.txt" >&2
          exit 1
      fi
      # Build deps.
      apt-get update
      apt-get install -y --no-install-recommends default-jdk libpam-dev
      [ -r "libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb" ] || curl -fsSL -O https://sourceforge.net/projects/libjpeg-turbo/files/${LIBJPEG_VERSION}/libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb
      dpkg -i libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb
      # Build deb package.
      src_dir=$PWD
      export CCACHE_DIR="$src_dir"/.ccache
      mkdir -p "$CCACHE_DIR"
      ccache -M 100M
      build_dir=$(mktemp -d)
      cd "$build_dir"
      cmake -DCMAKE_C{,XX}_COMPILER_LAUNCHER=ccache "$src_dir"
      make -j4 deb
      # Extract version number.
      PKG_FILE_NAME="$(ls turbovnc_*.deb | head -n1)"
      FULL_VERSION="$(echo "$PKG_FILE_NAME" | sed -nre "s/turbovnc_(.*)_[^_]+\\.deb/\\1/p")"
      TURBOVNC_ANATOSCOPE_VERSION="$(echo "$PKG_FILE_NAME" | sed -nre "s/turbovnc_.*anatoscope-([^_]+)_[^_]+\\.deb/\\1/p")"
      [ -n "$FULL_VERSION" -a -n "$TURBOVNC_ANATOSCOPE_VERSION" ]
      # Upload to GitLab as a generic package.
      http_response_file=$(mktemp)
      http_status="$(curl --silent --write-out "%{http_code}" --output "$http_response_file" --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$PKG_FILE_NAME" "$DESTINATION$TURBOVNC_ANATOSCOPE_VERSION/")"
      cat $http_response_file
      echo $http_status
      [[ "$http_status" =~ 2[[:digit:]]{2} ]]
      # Save version number and packaage file name for the next stage.
      echo "FULL_VERSION=$FULL_VERSION" > "$src_dir"/build-upload.env
      echo "TURBOVNC_ANATOSCOPE_VERSION=$TURBOVNC_ANATOSCOPE_VERSION" >> "$src_dir"/build-upload.env
      echo "PKG_FILE_NAME=$PKG_FILE_NAME" >> "$src_dir"/build-upload.env
  artifacts:
    reports:
      dotenv: build-upload.env

docker-image:
  stage: release
  image: docker
  services:
    - docker:dind                   # necessary for docker run
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      [ -n "$FULL_VERSION" -a  -n "$TURBOVNC_ANATOSCOPE_VERSION" -a -n "$PKG_FILE_NAME" ]
      wget --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$DESTINATION/$TURBOVNC_ANATOSCOPE_VERSION/$PKG_FILE_NAME" \
        "$CI_API_V4_URL/projects/35257008/packages/generic/libjpeg/${LIBJPEG_VERSION}/libjpeg-turbo-official_${LIBJPEG_VERSION}_amd64.deb" \
        "$CI_API_V4_URL/projects/35257008/packages/generic/virtualgl/${VIRTUALGL_VERSION}/virtualgl_${VIRTUALGL_VERSION}_amd64.deb"
      docker build --build-arg BUILDKIT_SYNTAX=docker/dockerfile:1.3.1 --build-arg="ANATODOCKER_TAG=$ANATODOCKER_TAG" --tag $CI_REGISTRY_IMAGE:libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION} .
      docker push $CI_REGISTRY_IMAGE:libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION}
  after_script:
    # Use "--force" to prevent the command from failing if the image doesn't exist
    - docker rmi --force $CI_REGISTRY_IMAGE:libjpeg-${LIBJPEG_VERSION}-turbovnc-$FULL_VERSION-virtualgl-${VIRTUALGL_VERSION}

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    GIT_STRATEGY: none
  script:
    - |
      [ -n "$FULL_VERSION" -a -n "$PKG_FILE_NAME" ]
      release-cli create --tag-name "$FULL_VERSION" --name "Release $FULL_VERSION" --description "Release $FULL_VERSION (Anatoscope fork version)" --assets-link "{\"name\": \"$PKG_FILE_NAME\", \"url\": \"$DESTINATION$TURBOVNC_ANATOSCOPE_VERSION/$PKG_FILE_NAME\"}"

.alpha:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  variables:
    GIT_STRATEGY: none
  image: registry.gitlab.com/anatoscope/interne/system/app/curl
  script:
    - |
      set -x
      [ -n "$FULL_VERSION" -a  -n "$TURBOVNC_ANATOSCOPE_VERSION" ]
      # Trigger a pipeline in the webapp project to copy this image to the docker
      # registry used by the webapp.
      curl --fail --request POST \
        --form "token=$CI_JOB_TOKEN" \
        --form "ref=$WEBAPP_CICD_PIPELINE_REF" \
        --form "variables[env]=alpha" \
        --form "variables[source_registry]=$CI_REGISTRY_IMAGE" \
        --form "variables[source_tag]=libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION}" \
        --form "variables[source_application]=turbovnc" \
        --form "variables[custom_tag]=libjpeg-${LIBJPEG_VERSION}-turbovnc-${FULL_VERSION%%-*}-turbovnc_anatoscope-$TURBOVNC_ANATOSCOPE_VERSION-virtualgl-${VIRTUALGL_VERSION}" \
        "$CI_API_V4_URL/projects/$WEBAPP_CICD_PROJECT_ID/trigger/pipeline"

orthopedics-alpha:
  extends: .alpha
  variables:
    WEBAPP_CICD_PROJECT_ID: 35161498

circle-alpha:
  extends: .alpha
  variables:
    WEBAPP_CICD_PROJECT_ID: 37235366
